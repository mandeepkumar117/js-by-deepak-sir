<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #nav{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
           
        }
        #nav a{
            margin: 0 15px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <nav id="nav">

    </nav>
    <script>
        let nav=[{
            'name':"Home",
            "linkedto":"Home.html"
        },
        {
            'name':'about',
            "linkedto":"about.html"
        },
        {
            'name':"contact",
            "linkedto":"contact.html"
        }
    ];

    let store=document.querySelector('#nav');
    store.innerHTML=nav.map(e=>{
        return `
           <a href="${e.linkedto}"> ${e.name}</a>
        `
    }).join(" ");
    </script>
</body>
</html>
