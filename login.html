<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        #form{
            width: 200px;
            height: 230px;
            background-color: rgb(66, 40, 238);
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;

        }
        #form input{
            margin: 10px;
            border-radius: 5px;
            width: 180px;
           
        }
        button{
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <center>
        <div id="form">
            <h2>Login Form</h2>
            <div><input type="text" placeholder="name" id="name"></div>
            <div><input type="text" placeholder="email" id="email"></div>
            <div><input type="text" placeholder="password" id="password"></div>
            <div><button onclick="run();">Login</button></div>
        </div>
    </center>
</body>
</html>
